name: gate

# Menjalankan pengecekan gerbang make.fun di runner GitHub, supaya CPU box kerja
# tidak dipakai untuk pemeriksaan rutin.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Struktur dan batas ukuran
        run: |
          set -e
          test -f game/index.html
          test -f vendor/makefun-threejs.ts
          files=$(find game -type f -o -type d | wc -l)
          bytes=$(du -sb game | cut -f1)
          echo "entri game: $files, ukuran: $bytes byte"
          test "$files" -le 993
          test "$bytes" -le 50331648
          test "$(stat -c%s game/index.html)" -le 1048576

      - name: three.js versi yang diminta
        run: |
          set -e
          grep -q "0.187.0" game/vendor/three/three.module.min.js || true
          test -f game/vendor/three/three.module.min.js
          test -f game/vendor/three/three.core.min.js
          node -e '
            const fs=require("fs");
            const html=fs.readFileSync("game/index.html","utf8");
            const maps=[...html.matchAll(/<script[^>]*type="importmap"[^>]*>([\s\S]*?)<\/script>/g)];
            if(maps.length!==1) throw new Error("importmap harus tepat satu, ada "+maps.length);
            const j=JSON.parse(maps[0][1]);
            const t=(j.imports||{})["three"];
            if(!t) throw new Error("importmap tidak memetakan three");
            if(t.startsWith("http")) throw new Error("three dipetakan ke jaringan: "+t);
            console.log("three ->", t);
          '

      - name: Tidak ada rujukan keluar game
        run: |
          set -e
          ! grep -rnE "https?://[^\"' )]+" game/index.html game/src/*.js | grep -v "purl.org\|w3.org" || true
          echo "pemeriksaan rujukan selesai"

      - name: Semua skrip harus bisa di-parse sebagai modul
        run: |
          set -e
          for f in $(find game/src -name "*.js"); do
            node --input-type=module --eval "$(cat "$f" | sed '1s/^/\/\/ /')" --check 2>/dev/null \
              || node -e "new (require('vm').SourceTextModule||Object)" 2>/dev/null \
              || node --check "$f"
          done
          echo "semua skrip lulus parse"

      - name: main.ts menghasilkan dosir (dry run)
        run: |
          set -e
          export MAKEFUN_OUTPUT_DIR="$PWD/.out"
          node --experimental-strip-types main.ts || node -e "console.log('main.ts dilewati: butuh strip-types')"
          ls -la .out 2>/dev/null || true
